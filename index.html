<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Heart</title>
<style> html, body { margin: 0; height: 100%; background: #060208; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="1600"></canvas>
<script>
const SC = 21, OY = 20, DURATION = 10, TICK = 16, ANIM = 42, LIFT = 34, GAP = 7;
const SIZES = [9, 10, 11, 12];
const BG = "#060208";
const PX = 4 / 3; // Tk points -> CSS pixels
const PHRASES = [
  "I Love You", "Seni Seviyorum", "Te Amo", "Je T'aime",
  "Ich Liebe Dich", "Ti Amo", "Eu Te Amo", "Я тебя люблю",
  "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ", "Σ' αγαπώ",
  "Ik Hou Van Jou", "Jag älskar dig", "Kocham cię",
  "ฉันรักเธอ", "Anh yêu em", "Aku Cinta Kamu", "Я тебе кохаю"
];

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const layer = document.createElement("canvas");
layer.width = layer.height = 1600;
const lctx = layer.getContext("2d");
for (const g of [ctx, lctx]) { g.scale(2, 2); g.translate(400, 400); g.textAlign = "center"; g.textBaseline = "middle"; }

// seeded RNG (mulberry32)
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(11);
const uniform = (a, b) => a + (b - a) * rand();
const choice = arr => arr[Math.floor(rand() * arr.length)];

const fontStr = (sz) => `bold ${(sz * PX).toFixed(1)}px Arial, "Noto Sans", sans-serif`;
const clamp = v => Math.max(0, Math.min(1, v));
const mix = (a, b, k) => a.map((p, i) => p + (b[i] - p) * k);
const dim = (c, k) => c.map(v => v * k);
const rgb = c => `rgb(${c.map(v => Math.round(clamp(v) * 255)).join(",")})`;
const BGC = [1, 3, 5].map(i => parseInt(BG.slice(i, i + 2), 16) / 255);
const FLASH = [1.0, 0.78, 0.78];

function heart(a) {
  const x = 16 * Math.sin(a) ** 3;
  const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
  return [x * SC, y * SC + OY];
}

const POLY = Array.from({ length: 720 }, (_, i) => heart(2 * Math.PI * i / 720));
const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const CY = (YMAX + YMIN) / 2;

function spans(y) {
  const xs = [];
  for (const [[x1, y1], [x2, y2]] of EDGES) {
    if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
      xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
    }
  }
  xs.sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
  return out;
}

function intersect(A, B) {
  const out = [];
  for (const a of A) for (const b of B) {
    const lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
    if (hi - lo > 14) out.push([lo, hi]);
  }
  return out;
}

let order = [];
function* phraseCycle() {
  while (true) {
    const o = PHRASES.slice();
    for (let i = o.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [o[i], o[j]] = [o[j], o[i]];
    }
    yield* o;
  }
}

function mathDist(x, y) {
  return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
}

function build() {
  const cycle = phraseCycle();
  const rowH = Math.max(...SIZES.map(z => z * PX * 1.2)) + 4;
  const half = rowH / 2;
  const placed = [];

  for (let y = YMAX - half; y > YMIN + half; y -= rowH) {
    const row = intersect(spans(y + half), spans(y - half));
    for (let [lo, hi] of row) {
      lo += 4; hi -= 4;
      let cur = lo + uniform(0, 8);
      const line = [];
      while (true) {
        let fit = null;
        for (let k = 0; k < 10; k++) {
          const text = cycle.next().value;
          const size = choice(SIZES);
          ctx.font = fontStr(size);
          const w = ctx.measureText(text).width;
          if (cur + w <= hi) { fit = { text, size, w }; break; }
        }
        if (!fit) break;
        line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
        cur += fit.w + GAP;
      }
      if (!line.length) continue;
      if (line.length > 1) {
        const last = line[line.length - 1];
        const left = hi - (last.x + last.w / 2);
        line.forEach((it, i) => { it.x += left * i / (line.length - 1); });
      } else {
        line[0].x = (lo + hi) / 2;
      }
      line.forEach((it, i) => {
        placed.push({ x: it.x, y, text: it.text, size: it.size, edge: i === 0 || i === line.length - 1 });
      });
    }
  }

  const wine = [0.58, 0.0, 0.09], crimson = [0.90, 0.05, 0.14], blood = [0.98, 0.10, 0.16];
  for (const p of placed) {
    const rad = Math.min(1, mathDist(p.x, p.y));
    let base = mix(wine, crimson, 0.25 + 0.75 * rad);
    base = mix(base, blood, uniform(0, 0.35) + (p.edge ? 0.3 : 0));
    p.color = base.map(v => Math.min(1, v));
    p.rad = rad;
  }

  const edges = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);
  const TWO_PI = 2 * Math.PI;
  const ang = p => ((Math.atan2(p.x, p.y - CY) % TWO_PI) + TWO_PI) % TWO_PI;
  edges.sort((a, b) => ang(a) - ang(b));
  inner.forEach(p => { p.key = -p.rad + uniform(0, 0.08); });
  inner.sort((a, b) => a.key - b.key);
  return edges.concat(inner);
}

function drawItem(g, p, u) {
  const e = 1 - (1 - u) ** 3;
  const c = p.color;
  const x = p.x, y = -p.y;
  const hover = (1 - e) * LIFT;
  const px = x + p.dx * (1 - e);
  const py = y - hover;

  g.font = fontStr(p.size);
  g.fillStyle = rgb(mix(BGC, dim(c, 0.30), e));
  g.fillText(p.text, x + 2, y + 3);

  g.font = fontStr(p.size + 1);
  g.fillStyle = rgb(mix(BGC, dim(c, 0.20), e * e));
  g.fillText(p.text, px, py);

  const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
  g.font = fontStr(p.size);
  g.fillStyle = rgb(mix(mix(BGC, c, e ** 1.5), FLASH, flash));
  g.fillText(p.text, px, py);
}

let start = null, next = 0, shimmerAt = 0;
const active = [], shimmers = [];
let ORDER = [];

function frame(now) {
  if (start === null) start = now;
  const el = now - start;

  while (next < ORDER.length && ORDER[next].t <= el) active.push(ORDER[next++]);

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1600, 1600);
  ctx.drawImage(layer, 0, 0);
  ctx.restore();

  for (let i = active.length - 1; i >= 0; i--) {
    const p = active[i];
    const u = clamp((el - p.t) / (ANIM * TICK));
    if (u >= 1) {
      drawItem(lctx, p, 1);
      drawItem(ctx, p, 1);
      active.splice(i, 1);
    } else {
      drawItem(ctx, p, u);
    }
  }

  if (next >= ORDER.length && !active.length) {
    if (el >= shimmerAt) {
      shimmers.push({ p: choice(ORDER), until: el + 260 });
      shimmerAt = el + 140;
    }
    for (let i = shimmers.length - 1; i >= 0; i--) {
      const s = shimmers[i];
      if (el > s.until) { shimmers.splice(i, 1); continue; }
      ctx.font = fontStr(s.p.size);
      ctx.fillStyle = rgb(mix(s.p.color, FLASH, 0.6));
      ctx.fillText(s.p.text, s.p.x, -s.p.y);
    }
  }
  requestAnimationFrame(frame);
}

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  ORDER = build();
  const gap = (DURATION * 1000) / ORDER.length;
  ORDER.forEach((p, i) => { p.t = 200 + i * gap; p.dx = uniform(-10, 10); });
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
